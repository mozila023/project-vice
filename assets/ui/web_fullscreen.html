<style>
#vice-fullscreen{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:20;width:46px;height:42px;border:1px solid #65827e;border-radius:12px;background:#102c2be6;color:#f5d6a2;font:28px sans-serif;touch-action:manipulation;cursor:pointer}
#vice-fullscreen:focus-visible{outline:2px solid #f5d6a2}
</style>
<button id="vice-fullscreen" type="button" aria-label="Full screen" title="Full screen">⛶</button>
<script>
(() => {
  const button = document.getElementById('vice-fullscreen');
  button.addEventListener('pointerdown', event => event.preventDefault());
  button.addEventListener('click', async event => {
    event.stopPropagation();
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
      } else {
        const root = document.documentElement;
        if (root.requestFullscreen) await root.requestFullscreen({ navigationUI: 'hide' });
        else if (root.webkitRequestFullscreen) await root.webkitRequestFullscreen();
        else {
          button.title = 'Safari: Share → Add to Home Screen';
          alert('Safari: กดแชร์ แล้วเลือกเพิ่มไปยังหน้าจอโฮม เพื่อเล่นแบบเต็มจอ');
          return;
        }
        try { await screen.orientation.lock('landscape'); } catch (_) {}
      }
    } catch (_) { button.title = 'แตะเพื่อเปิดเต็มจออีกครั้ง'; }
    document.getElementById('canvas')?.focus();
  });
  const update = () => button.setAttribute('aria-label', (document.fullscreenElement || document.webkitFullscreenElement) ? 'Exit full screen' : 'Full screen');
  document.addEventListener('fullscreenchange', update);
  document.addEventListener('webkitfullscreenchange', update);
})();
</script>
